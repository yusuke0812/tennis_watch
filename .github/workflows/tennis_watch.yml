# GitHub Actions 版（PC に依存しない実行）。cron は UTC: JST 6:00〜23:59 の20分ごと
# 秘密情報: リポジトリの Settings > Secrets and variables > Actions に LINE_TOKEN / LINE_USER_ID を登録
# 状態（前回の空き）は Actions のキャッシュに保存して次回に引き継ぐ
name: tennis_watch
on:
  schedule:
    - cron: "*/20 21-23,0-14 * * *"
  workflow_dispatch:

concurrency:
  group: tennis_watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}
          restore-keys: tennis-state-
      - run: python3 tennis_watch.py
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          TENNIS_STATE: state.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: tennis-state-${{ github.run_id }}
